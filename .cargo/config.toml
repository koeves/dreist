# The editor's tests and examples run under the shared crates' reference
# profile: point it at this repository's UI and factory data.
[env]
DREIST_UI = { value = "assets/ui", relative = true }
DREIST_RESOURCES = { value = "assets/factory", relative = true }

# Windows builds link the C runtime statically, so the plugins and the app
# need no Visual C++ Redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
