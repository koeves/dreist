name: Release

# Releases a tag `vX.Y.Z`: checks that commons is a dreist-commons release,
# checks the commit subjects, runs the CI suite, builds Dreist (VST3, CLAP,
# standalone) on macOS, Windows and Linux with the tag's version written into
# Cargo.toml, tests it and publishes the GitHub release with the zips (tarballs on Linux). Called
# by release-on-main.yml once it has tagged the merge of a release pull
# request; also runs on a tag pushed by hand (a tag pushed by
# release-on-main.yml with GITHUB_TOKEN starts no second run) and by hand
# (`workflow_dispatch`: builds the checked-out ref, uploads to `tag` only when
# `upload` is set). No workflow runs on other branch pushes (CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag"
        type: string
        required: true
      upload:
        description: "Upload the zips to the release"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (names the zips; the upload target)"
        required: true
      upload:
        description: "Upload the zips to the release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  commons:
    # The submodule must be the commit of a dreist-commons release tag.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: commons is a dreist-commons release
        run: .github/release/check-commons.sh

  commits:
    uses: ./.github/workflows/commits.yml

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [commons, commits, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version from the tag
        # Only in this checkout: the plugins, the app's Info.plist and the
        # About panel show it.
        run: |
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            .github/release/stamp-version.sh "$TAG"
          fi
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runners' Azure mirror sometimes stops resolving; install from the main archive.
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libjack-jackd2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcursor-dev libgl1-mesa-dev xvfb
      - name: Test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo test --locked --workspace
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/build.sh
          cd target/bundled
          ditto -c -k --keepParent Dreist.vst3 "Dreist-$TAG-${{ matrix.name }}-VST3.zip"
          ditto -c -k --keepParent Dreist.clap "Dreist-$TAG-${{ matrix.name }}-CLAP.zip"
          ditto -c -k --keepParent Dreist.app "Dreist-$TAG-${{ matrix.name }}-App.zip"
          # Everything with install.sh (commons/packaging) in one folder.
          full="Dreist-$TAG-${{ matrix.name }}"
          mkdir "$full"
          for p in install.sh Dreist.vst3 Dreist.clap Dreist.app; do ditto "$p" "$full/$p"; done
          ditto -c -k --keepParent "$full" "$full.zip"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          scripts/build-windows.sh
          cd target/bundled
          mv Dreist-CLAP Dreist && 7z a -tzip "Dreist-$TAG-${{ matrix.name }}-CLAP.zip" Dreist && mv Dreist Dreist-CLAP
          mv Dreist-App Dreist && 7z a -tzip "Dreist-$TAG-${{ matrix.name }}-App.zip" Dreist && mv Dreist Dreist-App
          7z a -tzip "Dreist-$TAG-${{ matrix.name }}-VST3.zip" Dreist.vst3
          # Everything with install.ps1 (commons/packaging) in one folder.
          full="Dreist-$TAG-${{ matrix.name }}"
          mkdir "$full" && cp -R install.ps1 Dreist.vst3 Dreist-CLAP Dreist-App "$full/"
          7z a -tzip "$full.zip" "$full"
      - name: Build (Linux)
        # tar keeps the executable bits; the CLAP and the app unpack into a
        # Dreist/ folder each, the full archive into Dreist-<tag>-Linux/ with
        # install.sh (README: Linux).
        if: runner.os == 'Linux'
        run: |
          scripts/build-linux.sh
          cd target/bundled
          tar -czf "Dreist-$TAG-${{ matrix.name }}-VST3.tar.gz" Dreist.vst3
          tar -czf "Dreist-$TAG-${{ matrix.name }}-CLAP.tar.gz" --transform 's,^Dreist-CLAP,Dreist,' Dreist-CLAP
          tar -czf "Dreist-$TAG-${{ matrix.name }}-App.tar.gz" --transform 's,^Dreist-App,Dreist,' Dreist-App
          # Everything with install.sh (commons/packaging) in one folder.
          tar -czf "Dreist-$TAG-${{ matrix.name }}.tar.gz" --transform "s,^,Dreist-$TAG-${{ matrix.name }}/," install.sh Dreist.vst3 Dreist-CLAP Dreist-App
          # The .deb for the apt repository (commons/packaging/deb.sh).
          full="Dreist-$TAG-${{ matrix.name }}"
          mkdir "$full" && cp -R install.sh Dreist.vst3 Dreist-CLAP Dreist-App "$full/"
          DEB_MAINTAINER="${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>" \
            DEB_DESCRIPTION="Drum sampler, sequencer and performance instrument (app, VST3, CLAP)" \
            DEB_HOMEPAGE="https://github.com/${{ github.repository }}" \
            sh ../../commons/packaging/deb.sh "$full" "$TAG" .
      - uses: actions/upload-artifact@v7
        with:
          name: Dreist-${{ env.TAG }}-${{ matrix.name }}
          path: |
            target/bundled/Dreist-*.zip
            target/bundled/Dreist-*.tar.gz
            target/bundled/dreist_*.deb
          retention-days: 7

  release:
    # The notes are the tag's changelog section, generated from the commits
    # since the previous tag (.github/release/notes.sh, cliff.toml).
    needs: build
    if: inputs.upload || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: .github/release/notes.sh "$TAG" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.repository.name }} ${{ env.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.zip dist/*.tar.gz dist/*.deb --clobber

  packages:
    # The Homebrew cask (koeves/homebrew-tap) and the signed apt repository
    # (koeves/apt), from the release's archives; each step runs only when
    # its secrets are set (commons/packaging/README.md: Packages).
    needs: release
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Homebrew cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          arm=$(sha256sum "dist/Dreist-$TAG-macOS-AppleSilicon.zip" | cut -d' ' -f1)
          intel=$(sha256sum "dist/Dreist-$TAG-macOS-Intel.zip" | cut -d' ' -f1)
          for attempt in 1 2 3; do
            rm -rf tap
            git clone -q --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/koeves/homebrew-tap" tap
            mkdir -p tap/Casks
            sh commons/packaging/cask.sh Dreist "$TAG" "$arm" "$intel" "${{ github.repository }}" \
              "Drum sampler, sequencer and performance instrument" >tap/Casks/dreist.rb
            git -C tap add Casks/dreist.rb
            git -C tap diff --cached --quiet && break
            git -C tap commit -q -m "dreist ${TAG#v}"
            git -C tap push -q origin HEAD:main && break
            [ "$attempt" = 3 ] && exit 1
          done
      - name: apt repository
        if: env.APT_REPO_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          APT_KEY_ID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          export APT_KEY_ID
          for attempt in 1 2 3; do
            rm -rf apt
            git clone -q --depth 1 "https://x-access-token:$APT_REPO_TOKEN@github.com/koeves/apt" apt
            sh commons/packaging/apt-publish.sh apt dist/dreist_*.deb
            git -C apt add -A
            git -C apt diff --cached --quiet && break
            git -C apt commit -q -m "dreist ${TAG#v}"
            git -C apt push -q origin HEAD:main && break
            [ "$attempt" = 3 ] && exit 1
          done
