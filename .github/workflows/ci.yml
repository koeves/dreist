name: CI

# Runs on pull requests into dev and main, inside the release (release.yml)
# and by hand; never on plain branch pushes.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Windows that tests open stay in the background (commons vendor/baseview).
  DREIST_BACKGROUND_GUI: "1"

# Pull requests into dev run the fast checks (Linux); macOS (Apple Silicon and
# Intel) and Windows run on the release pull request (into main) and in the
# release. A skipped job counts as passed for the branch rules.
jobs:
  changes:
    # Whether a pull request changes more than Markdown: a docs-only pull
    # request skips the build and test jobs. Anything but a pull request runs
    # them all.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only "$BASE" "$HEAD") && [ -n "$files" ] \
            && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The CLI, the editor, the shared crates against Dreist's assets and the
    # generated files check headless on Linux.
    runs-on: ubuntu-24.04
    env:
      DREIST_UI: ${{ github.workspace }}/assets/ui
      DREIST_RESOURCES: ${{ github.workspace }}/assets/factory
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked -p dreist-cli -p dreist-editor --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p dreist-cli -p dreist-editor
      - name: Shared crates against Dreist's assets
        # The effect fingerprints hash float output, which differs between
        # platforms (they match on macOS, checked there): non-fatal here.
        run: cargo test --locked --manifest-path commons/Cargo.toml --workspace -- --skip effects_match_fingerprints
      - name: Effect fingerprints (platform-dependent)
        continue-on-error: true
        run: cargo test --locked --manifest-path commons/Cargo.toml -p dreist-dsp --test fx_harness effects_match_fingerprints
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generated UI assets are up to date
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libegl1 libgl1
          pip install skia-python==144.1 fonttools==4.68.0
          python3 scripts/uigen/uigen.py --check
      - name: Third-party notices are up to date
        run: python3 scripts/notices.py --check

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    # The plugin and app link AppKit: lint, test and build them on macOS,
    # with the shared crates' tests against Dreist's assets.
    runs-on: macos-15
    env:
      DREIST_UI: ${{ github.workspace }}/assets/ui
      DREIST_RESOURCES: ${{ github.workspace }}/assets/factory
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Shared crates against Dreist's assets
        run: cargo test --locked --manifest-path commons/Cargo.toml --workspace
      - name: Build plugin and standalone
        # Universal binaries: both slices build (releases ship one per Mac).
        run: scripts/build.sh --arch universal
      - name: Universal binaries
        run: |
          for b in Dreist.vst3/Contents/MacOS/Dreist Dreist.clap/Contents/MacOS/Dreist Dreist.app/Contents/MacOS/Dreist; do
            lipo "target/bundled/$b" -verify_arch arm64 x86_64
          done

  macos-intel:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    # The suite on Intel (x86_64): the macOS builds are universal.
    runs-on: macos-15-intel
    env:
      DREIST_UI: ${{ github.workspace }}/assets/ui
      DREIST_RESOURCES: ${{ github.workspace }}/assets/factory
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --workspace
      - name: Shared crates against Dreist's assets
        # The effect fingerprints hash float output, which differs on x86_64
        # (checked on Apple Silicon above): non-fatal here.
        run: cargo test --locked --manifest-path commons/Cargo.toml --workspace -- --skip effects_match_fingerprints
      - name: Effect fingerprints (platform-dependent)
        continue-on-error: true
        run: cargo test --locked --manifest-path commons/Cargo.toml -p dreist-dsp --test fx_harness effects_match_fingerprints

  linux-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The plugin and app on Linux (X11, ALSA): lint, test and bundle them.
    runs-on: ubuntu-24.04
    env:
      DREIST_UI: ${{ github.workspace }}/assets/ui
      DREIST_RESOURCES: ${{ github.workspace }}/assets/factory
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          # The runners' Azure mirror sometimes stops resolving; install from the main archive.
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libjack-jackd2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcursor-dev libgl1-mesa-dev xvfb
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (standalone)
        run: cargo clippy --locked -p dreist-plugin --all-targets --features standalone -- -D warnings
      - name: Test
        run: xvfb-run -a cargo test --locked --workspace
      - name: Build plugin and standalone
        run: scripts/build-linux.sh
      - name: Bundle layout
        run: |
          test -f target/bundled/Dreist.vst3/Contents/x86_64-linux/Dreist.so
          test -d target/bundled/Dreist.vst3/Contents/Resources/Dreist/Skin
          test -f target/bundled/Dreist-CLAP/Dreist.clap
          test -d target/bundled/Dreist-CLAP/Resources/Factory
          test -x target/bundled/Dreist-App/Dreist
          test -d target/bundled/Dreist-App/Resources/Dreist
