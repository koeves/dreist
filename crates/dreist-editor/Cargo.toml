description = "Dreist's editor panels on top of dreist-gui, driving dreist-engine through commands"

[dependencies]
dreist-testkit.workspace = true
dreist-formats.workspace = true
dreist-engine.workspace = true
dreist-dsp.workspace = true
dreist-gui.workspace = true
rfd = { version = "0.16", optional = true }

[features]
window = ["dreist-gui/window", "dep:rfd"]

[[example]]
name = "editor"
required-features = ["window"]


