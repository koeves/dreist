[package]
name = "geist-plugin"
edition.workspace = true
version.workspace = true
# The VST3 export links nih-plug's VST3 bindings (GPLv3), so this crate and
# the plugins and app built from it are GPL-3.0-or-later.
license = "GPL-3.0-or-later"
description = "Geist CLAP/VST3 plugin and standalone (nih-plug)"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "geist-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nih_plug/standalone", "dep:cpal", "dep:midir"]

[dependencies]
geist-dsp = { path = "../geist-dsp" }
geist-engine = { path = "../geist-engine" }
geist-gui = { path = "../geist-gui", features = ["window"] }
geist-editor = { path = "../geist-editor", features = ["window"] }
geist-formats = { path = "../geist-formats" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
cpal = { version = "=0.15.3", optional = true }
midir = { version = "=0.9.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
