[workspace]
resolver = "2"
members = ["crates/dreist-cli", "crates/dreist-editor", "crates/dreist-plugin", "xtask"]
# The commons submodule is its own workspace; its crates are dependencies here.
exclude = ["commons"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# The DSP is transcribed from the decompiled original: constants as the
# binary has them, operations in its order, explicit min/max where
# `clamp` would treat NaN differently.
[workspace.lints.clippy]
approx_constant = "allow"
excessive_precision = "allow"
assign_op_pattern = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
too_many_arguments = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
manual_range_contains = "allow"

[workspace.dependencies]
# The shared crates: the dreist-commons submodule at `commons`.
dreist-formats = { path = "commons/crates/dreist-formats" }
dreist-dsp = { path = "commons/crates/dreist-dsp" }
dreist-engine = { path = "commons/crates/dreist-engine" }
dreist-gui = { path = "commons/crates/dreist-gui" }
dreist-editor = { path = "crates/dreist-editor" }
dreist-testkit = { path = "commons/crates/dreist-testkit" }
roxmltree = "0.20"
thiserror = "2"

[profile.release]
strip = false

# The validation harness renders minutes of audio: optimise tests, keep
# debug assertions and overflow checks.
[profile.test]
opt-level = 2

# baseview with a re-entrancy guard (dreist-commons vendor/baseview):
# modal dialogs opened from a mouse event aborted the app.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "commons/vendor/baseview" }

# nih-plug whose CLAP state load survives corrupt state and asks the host
# to rescan the parameter values (dreist-commons vendor/nih-plug).
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "commons/vendor/nih-plug" }

# signalsmith-stretch with a fixed phase-randomisation seed
# (dreist-commons vendor/signalsmith-stretch) for reproducible renders.
[patch.crates-io]
signalsmith-stretch = { path = "commons/vendor/signalsmith-stretch" }
